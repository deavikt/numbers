<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="utf-8">
        <title>Числа</title>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <form method="post" id="number_input_form">
            <label for="number_input_field">Введите число</label><br>
            <input type="text" id="number_input_field" name="number" required>
            <button type="submit">Ввести</button><br>
        </form>

        <h3>Сумма введенных чисел:</h3>
        <h3 id="numbers_sum_field"></h3>
        <button id="count_button">Рассчитать</button>

        <script src="script.js"></script>
    </body>
</html>
